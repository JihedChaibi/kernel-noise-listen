name: Build and test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - name: Check ARM64 compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror src/listen.c -lm -o .build/kernel-noise-arm64
